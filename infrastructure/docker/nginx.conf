# Local reverse proxy template: routes the marketing/portal app and the API
# behind one origin, mirroring how the CDN/edge layer will route in production
# (see docs/architecture/architecture.md "Hosting/CDN"). Not yet wired into
# docker-compose.yml as a service — add one pointing here if/when local
# single-origin routing is needed; not required for local dev today.

events {}

http {
  server {
    listen 8080;

    location /api/ {
      proxy_pass http://api:4000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://web:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
