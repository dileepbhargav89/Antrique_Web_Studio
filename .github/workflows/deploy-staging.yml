name: Deploy - Staging

# Engineering polish pass (pre-Backend-v1.0-review) — Task 4, Deployment
# Workflow Templates. Manual-only until real hosting infrastructure exists
# (Terraform/k8s are still empty scaffolds — see
# infrastructure/terraform/README.md and docs/architecture/architecture.md
# "Hosting/CDN"). This is a TEMPLATE: it builds a real, deployable Docker
# image and validates the pipeline shape (deploy vs. rollback, health
# verification), but every step past "the image exists" is a deliberate
# placeholder — see each step's own comment for exactly what's real vs.
# not. Filling in a placeholder requires a real hosting target and real
# secrets in this workflow's "staging" GitHub Environment, neither of
# which are configured yet.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy a new build, or roll back to a previous one'
        required: true
        type: choice
        options: [deploy, rollback]
        default: deploy
      version:
        description: >-
          For deploy: git ref to build (defaults to the ref this workflow
          was triggered on). For rollback: the image tag/version to roll
          back to (required).
        required: false
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.15.9

jobs:
  deploy:
    name: Deploy to staging
    if: github.event.inputs.action == 'deploy'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Real step — produces the exact artifact a deploy would ship,
      # stamped with real identity metadata (see
      # docs/architecture/environment.md "Runtime version stamping").
      - name: Docker build (runtime image)
        run: |
          docker build \
            -f infrastructure/docker/api.Dockerfile \
            --target runtime \
            --build-arg APP_VERSION=${{ github.event.inputs.version || github.sha }} \
            --build-arg GIT_COMMIT_SHA=${{ github.sha }} \
            -t antrique-api:staging-${{ github.sha }} .

      # PLACEHOLDER — no container registry or hosting target is
      # provisioned yet (infrastructure/terraform/README.md remains a
      # scaffold). A real implementation pushes the image built above to
      # a registry (`${{ secrets.STAGING_REGISTRY }}`, a per-environment
      # secret bound to this workflow's "staging" GitHub Environment —
      # not yet configured) and triggers the hosting target to roll it
      # out (e.g. a managed-container `update-service` call, using
      # `${{ secrets.STAGING_DEPLOY_TOKEN }}`, also not yet configured).
      # Fails deliberately rather than faking success — see
      # docs/architecture/release.md "Deferred, explicitly."
      - name: Deploy (placeholder — no hosting target provisioned)
        run: |
          echo "Would push antrique-api:staging-${{ github.sha }} to \${{ secrets.STAGING_REGISTRY }}"
          echo "Would trigger a rollout on the staging hosting target using \${{ secrets.STAGING_DEPLOY_TOKEN }}"
          echo "No staging hosting target is provisioned yet — see docs/architecture/deployment.md §7."
          exit 1

      # PLACEHOLDER — would poll the newly-deployed instance's
      # GET /health/ready (see docs/architecture/runbook.md §1/§6) via
      # `${{ secrets.STAGING_HEALTH_CHECK_URL }}` until it returns 200 (or
      # a timeout is reached), and fail the workflow if it never does —
      # the same gate a real rolling deploy uses before routing real
      # traffic to the new instance. `if: false` — never runs today
      # (nothing above it ever succeeds to reach it); flip once a real
      # deploy step exists.
      - name: Verify deployment health (placeholder)
        if: false
        run: |
          echo "Would curl \${{ secrets.STAGING_HEALTH_CHECK_URL }}/health/ready until 200 or timeout"

  rollback:
    name: Roll back staging
    if: github.event.inputs.action == 'rollback'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate rollback target was provided
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            echo "::error::A rollback requires 'version' (the image tag/version to roll back to)."
            exit 1
          fi

      # PLACEHOLDER — see docs/architecture/release.md "Rollback
      # checklist." A real implementation re-points the staging hosting
      # target at the PREVIOUSLY-BUILT image tag `github.event.inputs.version`
      # (never rebuilds it — a rollback must deploy the exact bits that
      # were previously verified, not a fresh build of old source) using
      # the same `${{ secrets.STAGING_DEPLOY_TOKEN }}` a forward deploy
      # would use.
      - name: Roll back (placeholder — no hosting target provisioned)
        run: |
          echo "Would re-point the staging hosting target at image tag ${{ github.event.inputs.version }}"
          echo "using \${{ secrets.STAGING_DEPLOY_TOKEN }} — no hosting target is provisioned yet."
          exit 1

      - name: Verify rollback health (placeholder)
        if: false
        run: |
          echo "Would curl \${{ secrets.STAGING_HEALTH_CHECK_URL }}/health/ready until 200 or timeout"
