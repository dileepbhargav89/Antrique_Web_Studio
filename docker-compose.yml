# Local/production-shaped stack. Defaults to production-style images (built
# from the `runtime` Dockerfile stage). For local dev with hot-reload, this is
# combined automatically with docker-compose.override.yml (which switches the
# build target to `dev` and mounts source) whenever you run `docker compose up`.
#
# Copy apps/api/.env.example -> apps/api/.env and
#      apps/web/.env.local.example -> apps/web/.env.local before starting.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: antrique
      POSTGRES_PASSWORD: antrique
      POSTGRES_DB: antrique
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U antrique']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: runtime
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      DATABASE_URL: postgresql://antrique:antrique@postgres:5432/antrique
      REDIS_URL: redis://redis:6379
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: runtime
    env_file:
      - path: apps/web/.env.local
        required: false
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres-data:
